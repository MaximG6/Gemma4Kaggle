<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceBridge — Audio Upload Test</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0e17; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { max-width: 640px; width: 90%; padding: 2rem; }
h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #00d4aa; }
.subtitle { color: #8892a4; margin-bottom: 2rem; font-size: 0.9rem; }
.dropzone { border: 2px dashed #1e2a3a; border-radius: 16px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: all 0.2s; background: rgba(30,42,58,0.3); }
.dropzone:hover, .dropzone.dragover { border-color: #00d4aa; background: rgba(0,212,170,0.05); }
.dropzone-icon { font-size: 3rem; margin-bottom: 1rem; }
.dropzone-text { color: #8892a4; }
.dropzone-filename { color: #00d4aa; font-weight: 600; margin-top: 0.5rem; }
input[type="file"] { display: none; }
.btn { background: #00d4aa; color: #0a0e17; border: none; padding: 0.8rem 2rem; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 1rem; margin-top: 1.5rem; width: 100%; transition: opacity 0.2s; }
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.result { margin-top: 2rem; background: rgba(30,42,58,0.5); border-radius: 12px; padding: 1.5rem; display: none; }
.result h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #00d4aa; }
.triage-badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 6px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; }
.badge-red { background: #ff4757; color: #fff; }
.badge-orange { background: #ff9f43; color: #000; }
.badge-yellow { background: #feca57; color: #000; }
.badge-green { background: #2ed573; color: #000; }
.meta { margin-top: 1rem; font-size: 0.85rem; color: #8892a4; }
.meta span { color: #c8d6e5; }
.complaint { margin-top: 0.8rem; color: #c8d6e5; line-height: 1.5; }
.action { margin-top: 0.8rem; color: #feca57; font-style: italic; }
.flags { margin-top: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
.flag-tag { background: rgba(255,71,87,0.2); color: #ff6b81; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; }
.error { margin-top: 1rem; color: #ff4757; font-size: 0.9rem; display: none; }
.loading { text-align: center; padding: 2rem; display: none; }
.spinner { width: 40px; height: 40px; border: 3px solid #1e2a3a; border-top-color: #00d4aa; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>VoiceBridge Audio Test</h1>
  <p class="subtitle">Upload an audio file → transcription + AI triage via backend (port 8001)</p>

  <div class="dropzone" id="dropzone">
    <div class="dropzone-icon">🎙️</div>
    <div class="dropzone-text">Drop audio file here or click to browse</div>
    <div class="dropzone-filename" id="filename"></div>
  </div>
  <input type="file" id="fileInput" accept=".wav,.mp3,.m4a,.ogg,.flac,audio/*">

  <button class="btn" id="submitBtn" disabled>Submit for Triage</button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Processing audio...</p>
  </div>

  <div class="error" id="error"></div>

  <div class="result" id="result">
    <h2>Triage Result</h2>
    <div id="triageBadge" class="triage-badge"></div>
    <div class="complaint" id="complaint"></div>
    <div class="flags" id="flags"></div>
    <div class="action" id="action"></div>
    <div class="meta">Confidence: <span id="confidence"></span> · Latency: <span id="latency"></span></div>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:8001';
// const API_BASE = 'http://172.24.158.101:8001'; // WSL IP if needed

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const filenameEl = document.getElementById('filename');
const submitBtn = document.getElementById('submitBtn');
const loadingEl = document.getElementById('loading');
const errorEl = document.getElementById('error');
const resultEl = document.getElementById('result');

let selectedFile = null;

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

function handleFile(file) {
  selectedFile = file;
  filenameEl.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
  submitBtn.disabled = false;
  errorEl.style.display = 'none';
  resultEl.style.display = 'none';
}

submitBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  submitBtn.disabled = true;
  loadingEl.style.display = 'block';
  errorEl.style.display = 'none';
  resultEl.style.display = 'none';

  const formData = new FormData();
  formData.append('file', selectedFile);
  formData.append('lang', 'en');

  try {
    const resp = await fetch(`${API_BASE}/intake/audio`, { method: 'POST', body: formData });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
    const data = await resp.json();
    displayResult(data.triage);
  } catch (err) {
    errorEl.textContent = `Error: ${err.message}`;
    errorEl.style.display = 'block';
  } finally {
    loadingEl.style.display = 'none';
    submitBtn.disabled = false;
  }
});

function displayResult(t) {
  const badge = document.getElementById('triageBadge');
  badge.textContent = t.triage_level;
  badge.className = `triage-badge badge-${t.triage_level}`;

  document.getElementById('complaint').innerHTML = `<strong>Complaint:</strong> ${t.primary_complaint}`;

  const flagsEl = document.getElementById('flags');
  flagsEl.innerHTML = '';
  if (t.red_flag_indicators && t.red_flag_indicators.length) {
    t.red_flag_indicators.forEach(f => {
      const tag = document.createElement('span');
      tag.className = 'flag-tag';
      tag.textContent = f;
      flagsEl.appendChild(tag);
    });
  }

  if (t.recommended_action) {
    document.getElementById('action').innerHTML = `<strong>Action:</strong> ${t.recommended_action}`;
  }

  document.getElementById('confidence').textContent = t.confidence_score;
  document.getElementById('latency').textContent = `${(t.latency_s || 0).toFixed(1)}s`;

  resultEl.style.display = 'block';
}
</script>
</body>
</html>
